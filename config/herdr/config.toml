onboarding = false
[worktrees]
directory = "~/dev/.herdr/worktrees"

[keys]
prefix = "ctrl+s"

[theme]
name = "github-light"
auto_switch = true

[theme.custom]
panel_bg = "reset"
accent = "#03a441"
green = "#1ec604"
blue = "#3a18fe"
red = "#f82662"
yellow = "#f4a40f"

[ui]
agent_panel_sort = "spaces"
sidebar_width = 40
sidebar_min_width = 18
sidebar_max_width = 200

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace"],
  ["agent", "state_text"],
]

[session]
resume_agents_on_restore = true
